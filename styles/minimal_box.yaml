# Мінімалістичний стиль: текст на напівпрозорій плашці, без анімацій.
font: Montserrat

title:
  size: 70
  color: "#FFFFFF"
  outline_color: "#000000"
  outline: 18
  shadow: 0
  position: top
  margin_v: 300
  animation: fade
  box: true
  box_color: "#111111"

subtitles:
  size: 54
  color: "#FFFFFF"
  highlight_color: "#FFFFFF"
  outline_color: "#000000"
  outline: 14
  shadow: 0
  position: bottom
  margin_v: 380
  words_per_line: 5
  karaoke: false
  box: true
  box_color: "#000000"

end_card:
  background: "#111111"
  color: "#FFFFFF"
  size: 70
  duration: 2.0
