# ТЗ на відео для MemoCut. Найпростіше заповнити форму в програмі — цей файл вона зробить сама.

name: 'Між нами — промо 1'    # назва ролика
source_dir: 'E:\01. MemoGames\Україна\02. Між Нами  про любов'    # папка гри або папка з відео
folders:                # з яких підпапок брати відео
  - '02_Сирі'
  - '04_СММ'
format: '9x16'    # 9x16 | 1x1 | 4x5 | 16x9
style: 'couples_warm'    # файл зі styles/
variations: 3    # скільки різних варіантів змонтувати

segments:               # сцени по порядку; перша — хук
  - find: 'ми так сміялися'    # 1. хук: момент, де кажуть цю фразу
    title: 'Гра, яка зблизить вас'
    duration: 3
  - any: true    # 2. сцена: програма підбере найкращий кадр
    duration: 2.5
  - clip: 'LUB-UA-041'    # 3. сцена: конкретне відео з КАТАЛОГу (ID або файл)
    start: 3.2
    end: 7
    title: '120 питань для пар'
  - any: true    # 4. сцена без субтитрів
    duration: 2
    subtitles: false

overlay: 'Гра «Між нами» — 120 питань для пар'    # текст поверх усього відео
cta: 'Замовляй на memogames.ua'    # фінальна картка
music: null    # напр. 'E:\Музика\upbeat.mp3'
music_volume: 0.15

notes: |               # вільний текст ТЗ (для довідки)
  Тепле, щире відео, акцент на емоціях пари.
