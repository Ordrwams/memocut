name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Тести
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Завантажити FFmpeg (BtbN, win64 GPL)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item $bin.FullName ffmpeg\
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") ffmpeg\

      - name: Зібрати .exe
        run: pyinstaller --noconfirm memocut.spec

      - name: Додати FFmpeg, стилі, приклади
        shell: pwsh
        run: |
          $d = "dist\MemoCut"
          Copy-Item -Recurse ffmpeg "$d\ffmpeg"
          Copy-Item -Recurse styles "$d\styles"
          Copy-Item -Recurse briefs "$d\briefs"
          Copy-Item README.md "$d\README.md"

      - name: Перевірка запуску
        shell: pwsh
        run: |
          dist\MemoCut\memocut-cli.exe styles
          if ($LASTEXITCODE -ne 0) { throw "memocut-cli.exe не запустився" }

      - name: Запакувати
        shell: pwsh
        run: Compress-Archive -Path dist\MemoCut -DestinationPath MemoCut-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MemoCut-windows
          path: MemoCut-windows.zip
          retention-days: 30

      - name: Додати до релізу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MemoCut-windows.zip
